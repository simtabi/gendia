[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gendia"
version = "0.1.0"
description = "CI/CD-friendly Packagist (and npm + PyPI) dev-workflow handler for polyrepo ecosystems across GitHub, GitLab, and Bitbucket"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Simtabi LLC", email = "hello@simtabi.com" },
]
keywords = [
    "ci-cd",
    "release-automation",
    "packagist",
    "polyrepo",
    "dev-workflow",
    "git",
    "github",
    "gitlab",
    "bitbucket",
    "npm",
    "pypi",
    "composer",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/simtabi/gendia"
Repository = "https://github.com/simtabi/gendia"
Issues = "https://github.com/simtabi/gendia/issues"

[project.scripts]
gendia = "gendia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gendia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RET", "PL"]
ignore = ["S603", "S607", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
