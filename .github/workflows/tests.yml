name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint + typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: ruff check
        run: python -m ruff check src tests
      - name: ruff format
        run: python -m ruff format --check src tests
      - name: mypy strict
        run: python -m mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    name: Test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -ra

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    name: CLI smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: gendia --version
        run: gendia --version
      - name: gendia setup --detect (clean host returns 1)
        run: |
          set +e
          gendia setup --detect
          rc=$?
          if [ "$rc" != "1" ]; then
              echo "expected exit 1 (no setup), got $rc"; exit 1
          fi
      - name: gendia doctor (warns no env file)
        run: |
          set +e
          gendia doctor
          rc=$?
          if [ "$rc" != "1" ]; then
              echo "expected exit 1 (warnings), got $rc"; exit 1
          fi
