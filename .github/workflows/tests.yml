name: Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint + typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: ruff check
        run: python -m ruff check src tests
      - name: ruff format
        run: python -m ruff format --check src tests
      - name: mypy strict
        run: python -m mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    name: Test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -ra

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    name: CLI smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: wheel builds and bundles the data directory
        # The editable install above never builds a wheel, so a broken wheel
        # config (e.g. a force-include that duplicates files the package
        # already ships) would pass every other step and fail only at
        # release or `docker build`. Build it and check the data is inside.
        run: |
          python -m pip wheel --no-deps -w /tmp/wheel .
          files=$(python -m zipfile -l /tmp/wheel/*.whl)
          for f in gendia/data/forges.json gendia/data/standards/core.json \
                   gendia/data/scaffolds/bare.json gendia/data/scaffolds/_common/.gitignore; do
              echo "$files" | grep -qF "$f" || { echo "missing from wheel: $f"; exit 1; }
          done
      - name: gendia --version
        run: gendia --version
      - name: gendia setup --detect (clean host returns 1)
        # Run from /tmp so the repo's dogfood gendia.json isn't picked up
        # as ambient project config — we want to exercise the *clean host*
        # code path, not validate the dogfood project's credentials.
        working-directory: /tmp
        run: |
          set +e
          gendia setup --detect
          rc=$?
          if [ "$rc" != "1" ]; then
              echo "expected exit 1 (no setup), got $rc"; exit 1
          fi
      - name: gendia doctor (warns no env file)
        # Same isolation: doctor from a directory with no project config
        # surfaces warnings only (no env file, no accounts/registries),
        # which is the contract this smoke test pins.
        working-directory: /tmp
        run: |
          set +e
          gendia doctor
          rc=$?
          if [ "$rc" != "1" ]; then
              echo "expected exit 1 (warnings), got $rc"; exit 1
          fi

      - name: standards engine — list profiles
        # Should print the 16 bundled rule packs from bundled JSON resources.
        # Regresses if `_BUNDLED_PROFILES` falls out of sync with the data.
        working-directory: /tmp
        run: |
          count=$(gendia conventions --list-profiles | grep -cE '^  [a-z]')
          if [ "$count" -lt 16 ]; then
              echo "expected at least 16 bundled profiles, got $count"; exit 1
          fi

      - name: standards engine — list scaffolds
        # Should print the 13 bundled scaffolds from bundled JSON resources.
        working-directory: /tmp
        run: |
          count=$(gendia init --list-scaffolds | grep -cE '^  [a-z]')
          if [ "$count" -lt 13 ]; then
              echo "expected at least 13 bundled scaffolds, got $count"; exit 1
          fi

      - name: standards engine — --fix --dry-run on a fresh empty dir
        # Regression guard for `--fix` + `--dry-run` argparse wiring and the
        # bundled fix kinds. Expects at least one `would-fix` line for an
        # empty repo (R001 README is missing, etc.).
        run: |
          rm -rf /tmp/fix-smoke && mkdir /tmp/fix-smoke
          gendia conventions /tmp/fix-smoke --no-legacy --profile core --fix --dry-run \
              | grep -q 'would-fix' \
              || (echo "expected '--fix --dry-run' to print 'would-fix' lines"; exit 1)

      - name: bin/gendia-menu --list parses cleanly
        # Bash-syntax + resolution smoke for the interactive menu.
        run: |
          bash -n bin/gendia-menu
          bin/gendia-menu --list | grep -q '\[INSPECT\]'
